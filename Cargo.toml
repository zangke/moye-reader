[package]
name = "moye-reader"
version = "0.7.0"
edition = "2024"
description = "墨页 · A native local TXT and EPUB reader"

[workspace]
members = ["plugins/sdk", "plugins/folder-source"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "7.0.0"
encoding_rs = "0.8"
gpui-kit = "0.11.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
moye-plugin-api = { path = "plugins/sdk" }
percent-encoding = "2"
regex = "1"
roxmltree = "0.21"
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_XboxController"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"
